<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>消息助手 v6.0</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 启动动画 -->
    <div class="splash-screen" id="splash">
        <div class="splash-icon">💬</div>
        <div class="splash-title">消息助手</div>
        <div class="splash-subtitle">iOS风格自动发送工具</div>
    </div>

    <!-- 主界面 -->
    <div class="app-container" id="app" style="display:none;">
        <!-- 顶部导航 -->
        <header class="nav-bar">
            <h1 class="nav-title">消息助手</h1>
            <div class="nav-subtitle">v6.0 · iOS风格</div>
        </header>

        <main class="content">
            <!-- 消息输入卡片 -->
            <section class="card fade-in" id="card-message">
                <div class="card-header">
                    <span class="card-icon">📝</span>
                    <span class="card-title">消息内容</span>
                </div>
                <div class="card-body">
                    <textarea id="msgInput" placeholder="输入消息，每行一条&#10;支持emoji表情 😀" rows="5"></textarea>
                    <div class="char-count" id="charCount">0 字符</div>
                    <div class="preset-grid">
                        <button class="btn-preset btn-green" onclick="loadPreset('emoji')">😊 表情</button>
                        <button class="btn-preset btn-blue" onclick="loadPreset('num')">🔢 数字</button>
                        <button class="btn-preset btn-orange" onclick="loadPreset('greet')">👋 问候</button>
                    </div>
                </div>
            </section>

            <!-- 目标应用卡片 -->
            <section class="card fade-in delay-1" id="card-apps">
                <div class="card-header">
                    <span class="card-icon">📱</span>
                    <span class="card-title">目标应用</span>
                </div>
                <div class="card-body">
                    <div class="app-grid">
                        <button class="app-btn app-wechat active" onclick="selectApp(this, '微信')">
                            <span class="app-icon">💬</span>
                            <span class="app-name">微信</span>
                        </button>
                        <button class="app-btn app-qq" onclick="selectApp(this, 'QQ')">
                            <span class="app-icon">🐧</span>
                            <span class="app-name">QQ</span>
                        </button>
                        <button class="app-btn app-dingtalk" onclick="selectApp(this, '钉钉')">
                            <span class="app-icon">📌</span>
                            <span class="app-name">钉钉</span>
                        </button>
                        <button class="app-btn app-feishu" onclick="selectApp(this, '飞书')">
                            <span class="app-icon">🕊️</span>
                            <span class="app-name">飞书</span>
                        </button>
                        <button class="app-btn app-telegram" onclick="selectApp(this, 'Telegram')">
                            <span class="app-icon">✈️</span>
                            <span class="app-name">Telegram</span>
                        </button>
                        <button class="app-btn app-whatsapp" onclick="selectApp(this, 'WhatsApp')">
                            <span class="app-icon">📞</span>
                            <span class="app-name">WhatsApp</span>
                        </button>
                    </div>
                    <div class="selected-app" id="selectedApp">当前: 微信</div>
                </div>
            </section>

            <!-- 设置卡片 -->
            <section class="card fade-in delay-2" id="card-settings">
                <div class="card-header">
                    <span class="card-icon">⚙️</span>
                    <span class="card-title">发送设置</span>
                </div>
                <div class="card-body">
                    <!-- 模式选择 -->
                    <div class="setting-row">
                        <span class="setting-label">模式</span>
                        <div class="mode-toggle">
                            <button class="mode-btn active" onclick="selectMode(this, '顺序')">顺序</button>
                            <button class="mode-btn" onclick="selectMode(this, '随机')">随机</button>
                            <button class="mode-btn" onclick="selectMode(this, '单条')">单条</button>
                        </div>
                    </div>
                    
                    <!-- 间隔滑块 -->
                    <div class="setting-row">
                        <span class="setting-label">间隔</span>
                        <div class="slider-container">
                            <input type="range" id="speedSlider" min="0.5" max="5" step="0.1" value="1" oninput="updateSpeed(this.value)">
                            <div class="slider-value" id="speedValue">1.0 秒</div>
                        </div>
                    </div>
                    
                    <!-- 数量输入 -->
                    <div class="setting-row">
                        <span class="setting-label">数量</span>
                        <div class="batch-input-group">
                            <input type="number" id="batchInput" value="0" min="0" placeholder="0">
                            <span class="batch-hint">(0=无限)</span>
                        </div>
                    </div>
                </div>
            </section>

            <!-- 控制卡片 -->
            <section class="card fade-in delay-3" id="card-control">
                <div class="card-header">
                    <span class="card-icon">🎮</span>
                    <span class="card-title">控制</span>
                </div>
                <div class="card-body">
                    <div class="control-grid">
                        <button class="ctrl-btn btn-start" id="btnStart" onclick="startSending()">
                            <span class="ctrl-icon">▶</span>
                            <span class="ctrl-text">开始</span>
                        </button>
                        <button class="ctrl-btn btn-pause" id="btnPause" onclick="pauseSending()" disabled>
                            <span class="ctrl-icon">⏸</span>
                            <span class="ctrl-text">暂停</span>
                        </button>
                        <button class="ctrl-btn btn-stop" id="btnStop" onclick="stopSending()" disabled>
                            <span class="ctrl-icon">⏹</span>
                            <span class="ctrl-text">停止</span>
                        </button>
                    </div>
                </div>
            </section>

            <!-- 状态卡片 -->
            <section class="card fade-in delay-4" id="card-status">
                <div class="card-header">
                    <span class="card-icon">📊</span>
                    <span class="card-title">状态</span>
                </div>
                <div class="card-body">
                    <div class="status-row">
                        <div class="status-label" id="statusLabel">就绪</div>
                        <div class="status-count" id="countLabel">0</div>
                    </div>
                    <div class="stats-info" id="statsLabel">速度: 0 条/秒 | 耗时: 0 秒</div>
                    <!-- 进度条 -->
                    <div class="progress-bar">
                        <div class="progress-fill" id="progressFill"></div>
                    </div>
                </div>
            </section>

            <!-- 日志卡片 -->
            <section class="card fade-in delay-5" id="card-log">
                <div class="card-header">
                    <span class="card-icon">📋</span>
                    <span class="card-title">日志</span>
                    <button class="clear-log-btn" onclick="clearLog()">清空</button>
                </div>
                <div class="card-body">
                    <div class="log-container" id="logContainer">
                        <div class="log-item">
                            <span class="log-time">--:--:--</span>
                            <span class="log-msg">等待开始...</span>
                        </div>
                    </div>
                </div>
            </section>
        </main>

        <!-- 底部安全区 -->
        <div class="safe-area-bottom"></div>
    </div>

    <!-- Toast提示 -->
    <div class="toast" id="toast"></div>

    <script src="app.js"></script>
</body>
</html>
