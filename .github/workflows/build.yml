name: Build APK
on:
  push:
    tags:
      - v*
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Install
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo6 cmake libffi-dev libssl-dev automake zip unzip libltdl-dev
          pip install buildozer cython
      - name: Build
        run: |
          yes | buildozer android debug
        timeout-minutes: 120
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: bin/*.apk
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: apk
          path: ./apk
      - uses: softprops/action-gh-release@v1
        with:
          files: ./apk/*.apk
