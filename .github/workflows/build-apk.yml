name: Build Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  PYTHONFORANDROID_PREREQUISITES_INSTALL_INTERACTIVE: 0
  SKIP_PIP_SELF_UPGRADE: 1

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo6 cmake libffi-dev libssl-dev automake zip unzip libltdl-dev

      - name: Install buildozer
        run: |
          pip install buildozer cython

      - name: Patch pip to prevent self-upgrade
        run: |
          SITE=$(python3 -c "import site; print(site.getsitepackages()[0])")
          mkdir -p $SITE/pip
          python3 -c "
          import os, site
          site_pkg = site.getsitepackages()[0]
          pip_init = os.path.join(site_pkg, 'pip', '__init__.py')
          with open(pip_init, 'r') as f:
              content = f.read()
          if 'SKIP_PIP_SELF_UPGRADE' not in content:
              patch = '''import os as _os
if _os.environ.get('SKIP_PIP_SELF_UPGRADE'):
    import pip._internal.cli.main as _main
    _orig = _main.main
    def _patched():
        import sys
        args = sys.argv[1:]
        if len(args) >= 3 and args[0] == 'install' and args[1] == '-U' and 'pip' in args[2]:
            print('Blocked pip self-upgrade')
            return 0
        return _orig()
    _main.main = _patched
'''
              with open(pip_init, 'w') as f:
                  f.write(patch + content)
              print('Patched pip')
          "

      - name: Accept Android licenses
        run: |
          mkdir -p ~/.android
          echo -e "\n24333f8a63b6825ea9c5514f83c2829b004d1fee" > ~/.android/android-sdk-license
          echo -e "\nd56f5187479451eabf01fb78af6dfcb131a6481e" >> ~/.android/android-sdk-license
          echo -e "\n84831b9409646a918e30573bab4c9c91346d8abd" >> ~/.android/android-sdk-license

      - name: Build APK
        run: |
          yes | buildozer android debug
        timeout-minutes: 120

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: wechat-flood-apk
          path: bin/*.apk

  release:
    needs: build
    runs-on: ubuntu-22.04
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: wechat-flood-apk
          path: ./apk

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref }}
          name: "微信刷屏助手 ${{ github.ref_name }}"
          body: |
            ## 📲 下载安装
            下载 .apk 文件，在安卓手机上安装即可使用。
          files: ./apk/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
