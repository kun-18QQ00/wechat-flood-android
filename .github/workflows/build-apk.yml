name: Build Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: kivy/buildozer:latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build APK
        run: |
          chown -R 1000:1000 /__w/wechat-flood-android/wechat-flood-android
          buildozer android debug
        timeout-minutes: 180

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: wechat-flood-apk
          path: bin/*.apk

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: wechat-flood-apk
          path: ./apk

      - name: Get version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref }}
          name: "微信刷屏助手 ${{ steps.version.outputs.VERSION }}"
          body: |
            ## 微信刷屏助手 ${{ steps.version.outputs.VERSION }}
            ### ?? 下载安装
            下载下方的 `.apk` 文件，在手机上安装即可使用。
            ### ?? 注意
            - 首次安装需要允许「未知来源」应用
            - 需要存储和振动权限
          files: ./apk/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
