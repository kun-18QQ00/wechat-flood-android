name: Build Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git python3-pip autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo6 \
            cmake libffi-dev libssl-dev automake zip unzip openjdk-17-jdk

      - name: Install Python dependencies
        run: |
          pip install --upgrade "pip<23.3"
          pip install "buildozer<1.5" "cython<3.1"

      - name: Clear old buildozer cache
        run: |
          rm -rf ~/.buildozer
          rm -rf .buildozer
          rm -rf bin

      - name: Build APK (debug)
        run: |
          export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
          buildozer android debug
        timeout-minutes: 180

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: wechat-flood-apk
          path: bin/*.apk

  release:
    needs: build
    runs-on: ubuntu-22.04
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: wechat-flood-apk
          path: ./apk

      - name: Get version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref }}
          name: "微信刷屏助手 ${{ steps.version.outputs.VERSION }}"
          body: |
            ## 微信刷屏助手 ${{ steps.version.outputs.VERSION }}
            ### ?? 下载安装
            下载下方的 `.apk` 文件，在手机上安装即可使用。
            ### ?? 注意
            - 首次安装需要允许「未知来源」应用
            - 需要存储和振动权限
          files: ./apk/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
