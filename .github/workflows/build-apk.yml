name: Build Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git python3-pip autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo6 \
            cmake libffi-dev libssl-dev automake zip unzip openjdk-17-jdk

      - name: Install Python dependencies
        run: |
          pip install --upgrade "pip<24"
          pip install "buildozer<1.5" "cython<3.1"

      - name: Accept Android SDK licenses
        run: |
          mkdir -p ~/.android
          echo -e "\n24333f8a63b6825ea9c5514f83c2829b004d1fee" > ~/.android/android-sdk-license
          echo -e "\nd56f5187479451eabf01fb78af6dfcb131a6481e" >> ~/.android/android-sdk-license
          echo -e "\n84831b9409646a918e30573bab4c9c91346d8abd" >> ~/.android/android-sdk-license

      - name: Fix pip compatibility for buildozer venv
        run: |
          # Find the pip installer module and patch it to skip pip upgrade
          INSTALLER_PATH=$(python3 -c "import pip._internal.build_env.installer; print(pip._internal.build_env.installer.__file__)")
          echo "Patching: $INSTALLER_PATH"
          
          # Create a patched version that skips pip self-upgrade
          python3 << 'PYEOF'
          import pip._internal.build_env.installer as m
          import os
          
          fpath = m.__file__
          with open(fpath, 'r') as f:
              content = f.read()
          
          # Add a guard to skip pip upgrades in the install function
          old_func = "def install(requirements, target_dir, python_major_minor,"
          new_func = """def install(requirements, target_dir, python_major_minor,
              """
          
          # Simple patch: make install() return early for pip upgrades
          if "SKIP_PIP_UPGRADE" not in content:
              content = content.replace(
                  "    for requirement in requirements:",
                  """    # PATCHED: Skip pip self-upgrade
        filtered = [r for r in requirements if 'pip' not in str(getattr(r, 'name', r)).lower()]
        if not filtered:
            return
        requirements = filtered
        for requirement in requirements:"""
              )
              with open(fpath, 'w') as f:
                  f.write(content)
              print(f"Patched {fpath}")
          else:
              print("Already patched")
          PYEOF

      - name: Build APK
        run: |
          export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
          yes | buildozer android debug
        timeout-minutes: 120

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: wechat-flood-apk
          path: bin/*.apk

  release:
    needs: build
    runs-on: ubuntu-22.04
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: wechat-flood-apk
          path: ./apk

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref }}
          name: "微信刷屏助手 v3.0"
          body: |
            ## ?? 下载安装
            下载 `.apk` 文件，在安卓手机上安装即可使用。
            ### ?? 注意
            - 首次安装需允许「未知来源」应用
          files: ./apk/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
