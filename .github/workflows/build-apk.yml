name: Build Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  PYTHONFORANDROID_PREREQUISITES_INSTALL_INTERACTIVE: 0

jobs:
  build:
    runs-on: ubuntu-20.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git python3-pip autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo6 \
            cmake libffi-dev libssl-dev automake zip unzip libltdl-dev

      - name: Install buildozer
        run: |
          pip install buildozer cython

      - name: Build APK (debug)
        run: |
          yes | buildozer android debug
        timeout-minutes: 120

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: wechat-flood-apk
          path: bin/*.apk

  release:
    needs: build
    runs-on: ubuntu-20.04
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: wechat-flood-apk
          path: ./apk

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref }}
          name: "微信刷屏助手 ${{ github.ref_name }}"
          body: |
            ## 📲 下载安装
            下载 `.apk` 文件，在安卓手机上安装即可使用。
            ### ⚠️ 注意
            - 首次安装需允许「未知来源」应用
            - 需要存储和振动权限
          files: ./apk/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}