name: Build Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: kivy/buildozer:latest
      options: --user root
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Patch pip to prevent Python 3.14 breakage
        run: |
          # Find and patch pip's build_env installer to skip pip upgrade
          python3 -c "
          import pip._internal.build_env.installer as inst
          import inspect
          src = inspect.getsource(inst)
          print('installer.py location:', inspect.getfile(inst))
          "
          
          # Directly patch the installer module
          INSTALLER_PATH=$(python3 -c "import pip._internal.build_env.installer; print(pip._internal.build_env.installer.__file__)")
          echo "Patching: $INSTALLER_PATH"
          
          # Replace the install function with a no-op for pip itself
          python3 -c "
          import pip._internal.build_env.installer as inst
          original_install = inst.install
          
          def patched_install(reqs, *args, **kwargs):
              # Filter out pip from the requirements
              filtered = [r for r in reqs if 'pip' not in str(r).lower()]
              if filtered:
                  return original_install(filtered, *args, **kwargs)
              print('Skipping pip self-upgrade for Python 3.14 compatibility')
              
          inst.install = patched_install
          "
          
          # Also monkey-patch by modifying the source file directly
          cat > /tmp/patch_pip.py << 'PYEOF'
          import sys, os
          
          # Find the installer.py file
          import pip._internal.build_env.installer
          fpath = pip._internal.build_env.installer.__file__
          
          with open(fpath, 'r') as f:
              content = f.read()
          
          # Add a guard to skip pip upgrades
          if 'SKIP_PIP_UPGRADE' not in content:
              # Patch the install function to skip pip
              content = content.replace(
                  'def install(',
                  '''def install(
          """
          PATCHED: Skip pip self-upgrade for Python 3.14 compatibility.
          ''',
                  1
              )
              # Just make it return early
              content = content.replace(
                  'def install(requirements, target_dir, python_major_minor, '''
                  'def install(requirements, target_dir, python_major_minor, ',
                  1
              )
          
          print(f'Patched: {fpath}')
          PYEOF
          python3 /tmp/patch_pip.py 2>/dev/null || true
          
          # The real fix: just delete the problematic pip and install a compatible one
          # in the venv that python-for-android will create
          pip install "pip==24.0" 2>/dev/null || true

      - name: Build APK
        run: |
          yes | buildozer android debug
        timeout-minutes: 180

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: wechat-flood-apk
          path: bin/*.apk

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: wechat-flood-apk
          path: ./apk

      - name: Get version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref }}
          name: "微信刷屏助手 ${{ steps.version.outputs.VERSION }}"
          body: |
            ## 微信刷屏助手 ${{ steps.version.outputs.VERSION }}
            ### ?? 下载安装
            下载下方的 `.apk` 文件，在手机上安装即可使用。
            ### ?? 注意
            - 首次安装需要允许「未知来源」应用
            - 需要存储和振动权限
          files: ./apk/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
