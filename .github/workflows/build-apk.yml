name: Build Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: kivy/buildozer:latest
      options: --user root
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Patch pip for Python 3.14
        run: |
          # Find installer.py and replace the install function body
          INSTALLER=$(python3 -c "import pip._internal.build_env.installer as m; print(m.__file__)")
          echo "Patching $INSTALLER"
          # Replace the entire file with a minimal version that skips pip upgrade
          python3 << 'EOF'
          import pip._internal.build_env.installer as m
          fpath = m.__file__
          with open(fpath, 'r') as f:
              lines = f.readlines()
          # Find the install function and make it a no-op for pip
          new_lines = []
          in_install = False
          skip = False
          for line in lines:
              if line.startswith('def install('):
                  in_install = True
                  new_lines.append(line)
                  new_lines.append('    """Patched: skip pip self-upgrade"""\n')
                  new_lines.append('    import sys\n')
                  new_lines.append('    filtered = [r for r in requirements if "pip" not in str(getattr(r, "name", r)).lower()]\n')
                  new_lines.append('    if not filtered:\n')
                  new_lines.append('        return\n')
                  new_lines.append('    requirements = filtered\n')
                  skip = True
                  continue
              if in_install and skip:
                  if line.startswith('def ') or line.startswith('class ') or (line and not line[0].isspace() and not line.startswith('#')):
                      in_install = False
                      skip = False
                      new_lines.append(line)
                  continue
              new_lines.append(line)
          with open(fpath, 'w') as f:
              f.writelines(new_lines)
          print(f"Patched {fpath}")
          EOF

      - name: Build APK
        run: |
          yes | buildozer android debug
        timeout-minutes: 180

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: wechat-flood-apk
          path: bin/*.apk

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: wechat-flood-apk
          path: ./apk

      - name: Get version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref }}
          name: "微信刷屏助手 ${{ steps.version.outputs.VERSION }}"
          body: |
            ## 微信刷屏助手 ${{ steps.version.outputs.VERSION }}
            ### ?? 下载安装
            下载下方的 `.apk` 文件，在手机上安装即可使用。
            ### ?? 注意
            - 首次安装需要允许「未知来源」应用
            - 需要存储和振动权限
          files: ./apk/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
