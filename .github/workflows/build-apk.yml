name: Build Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: kivy/buildozer:latest
      options: --user root
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Accept Android licenses
        run: |
          mkdir -p /root/.buildozer/android/platform/android-sdk/licenses
          echo -e "\n24333f8a63b6825ea9c5514f83c2829b004d1fee" > /root/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
          echo -e "\n84831b9409646a918e30573bab4c9c91346d8abd" >> /root/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
          echo -e "\nd56f5187479451eabf01fb78af6dfcb131a6481e" >> /root/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
          echo -e "\ne6b7c2ab7fa2298c15165e9583d0222b24b9a170" >> /root/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
          echo -e "\nd975f751698a77b662f1254ddbeed3901e976f5a" > /root/.buildozer/android/platform/android-sdk/licenses/android-sdk-arm-dbt-license

      - name: Build APK
        run: |
          buildozer android debug
        timeout-minutes: 180

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: wechat-flood-apk
          path: bin/*.apk

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: wechat-flood-apk
          path: ./apk

      - name: Get version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref }}
          name: "微信刷屏助手 ${{ steps.version.outputs.VERSION }}"
          body: |
            ## 微信刷屏助手 ${{ steps.version.outputs.VERSION }}
            ### ?? 下载安装
            下载下方的 `.apk` 文件，在手机上安装即可使用。
            ### ?? 注意
            - 首次安装需要允许「未知来源」应用
            - 需要存储和振动权限
          files: ./apk/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
