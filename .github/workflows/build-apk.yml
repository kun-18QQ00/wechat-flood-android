name: Build Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: kivy/buildozer:latest
      options: --user root
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Fix pip for Python 3.14 compatibility
        run: |
          # Create a pip wrapper that prevents self-upgrade
          cat > /usr/local/bin/pip-safe << 'SCRIPT'
          #!/bin/bash
          # If trying to upgrade pip itself, use the current version
          if [[ "$*" == *"install -U pip"* ]] || [[ "$*" == *"install --upgrade pip"* ]]; then
            echo "Skipping pip self-upgrade for Python 3.14 compatibility"
            exit 0
          fi
          exec /usr/local/bin/python3 -m pip "$@"
          SCRIPT
          chmod +x /usr/local/bin/pip-safe
          
          # Also prevent pip from upgrading itself by setting env var
          echo 'PIP_NO_PYTHON_VERSION_WARNING=1' >> $GITHUB_ENV
          
          # Downgrade pip to a compatible version
          pip install "pip==24.0" 2>/dev/null || true
          
          # Monkey-patch buildozer to not upgrade pip
          PIP_PATH=$(python3 -c "import pip; print(pip.__file__)" 2>/dev/null || echo "")
          if [ -n "$PIP_PATH" ]; then
            PIP_DIR=$(dirname "$PIP_PATH")
            # Create a backup of pip's main module and patch it
            python3 -c "
          import importlib
          try:
              import pip._internal.build_env.installer as inst
              orig = inst.install
              def patched(*args, **kwargs):
                  print('Patched: skipping pip upgrade')
                  return
              inst.install = patched
          except: pass
          " 2>/dev/null || true
          fi

      - name: Build APK
        run: |
          yes | buildozer android debug
        timeout-minutes: 180

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: wechat-flood-apk
          path: bin/*.apk

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: wechat-flood-apk
          path: ./apk

      - name: Get version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref }}
          name: "微信刷屏助手 ${{ steps.version.outputs.VERSION }}"
          body: |
            ## 微信刷屏助手 ${{ steps.version.outputs.VERSION }}
            ### ?? 下载安装
            下载下方的 `.apk` 文件，在手机上安装即可使用。
            ### ?? 注意
            - 首次安装需要允许「未知来源」应用
            - 需要存储和振动权限
          files: ./apk/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
